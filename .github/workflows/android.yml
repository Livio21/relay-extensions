name: Android CI

on:
  push:
    paths-ignore:
      - "index.json"
      - "index.json.sig"
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: relay-extensions-${{ github.sha }}
        if-no-files-found: error
        retention-days: 14
        path: |
          ccmixter-source/app/build/outputs/apk/debug/*.apk
          ccmixter-source/app/build/outputs/apk/release/*.apk
          fma-source/app/build/outputs/apk/debug/*.apk
          fma-source/app/build/outputs/apk/release/*.apk
          octave-poc-source/app/build/outputs/apk/debug/*.apk
          octave-poc-source/app/build/outputs/apk/release/*.apk

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELAY_VERSION: 0.3.${{ github.run_number }}
      RELEASE_TAG: relay-${{ github.run_number }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Prepare signing files
      env:
        KEYSTORE_B64: ${{ secrets.RELAY_KEYSTORE_B64 }}
        KEYSTORE_PASSWORD: ${{ secrets.RELAY_KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.RELAY_KEY_PASSWORD }}
        REPOSITORY_PRIVATE_KEY: ${{ secrets.RELAY_REPOSITORY_PRIVATE_KEY_PEM }}
      run: |
        test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$REPOSITORY_PRIVATE_KEY"
        printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/relay-release.keystore"
        printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keystore.password"
        printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/key.password"
        printf '%s' "$REPOSITORY_PRIVATE_KEY" > "$RUNNER_TEMP/repository-private.pem"
        certificate=$(keytool -list -v -keystore "$RUNNER_TEMP/relay-release.keystore" -storepass "$KEYSTORE_PASSWORD" | awk -F': ' '/SHA256:/{gsub(":", "", $2); gsub(" ", "", $2); print tolower($2); exit}')
        test -n "$certificate"
        printf 'CERTIFICATE_SHA256=%s\n' "$certificate" >> "$GITHUB_ENV"
    - name: Build signed release APKs
      run: |
        chmod +x gradlew
        ./gradlew :fma-source:app:assembleRelease :ccmixter-source:app:assembleRelease :octave-poc-source:app:assembleRelease \
          -PrelayVersion="$RELAY_VERSION" \
          -PrelayVersionCode="${{ github.run_number }}" \
          -PrelayKeystoreFile="$RUNNER_TEMP/relay-release.keystore" \
          -PrelayKeystorePassword="$KEYSTORE_PASSWORD" \
          -PrelayKeyAlias=relay \
          -PrelayKeyPassword="$KEY_PASSWORD"
      env:
        KEYSTORE_PASSWORD: ${{ secrets.RELAY_KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.RELAY_KEY_PASSWORD }}
    - name: Prepare release assets
      run: |
        mkdir -p "$RUNNER_TEMP/release"
        cp fma-source/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release/fma.apk"
        cp ccmixter-source/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release/ccmixter.apk"
        cp octave-poc-source/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release/octavepoc.apk"
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Relay extensions ${{ env.RELAY_VERSION }}
        draft: false
        prerelease: true
        files: ${{ runner.temp }}/release/*.apk
    - name: Update and sign catalog
      env:
        REPOSITORY_PRIVATE_KEY: ${{ secrets.RELAY_REPOSITORY_PRIVATE_KEY_PEM }}
      run: |
        python3 scripts/update-index.py \
          --version "$RELAY_VERSION" \
          --release-tag "$RELEASE_TAG" \
          --repository "${{ github.repository }}" \
          --certificate "$CERTIFICATE_SHA256" \
          --artifact org.relay.extensions.fma "$RUNNER_TEMP/release/fma.apk" \
          --artifact org.relay.extensions.ccmixter "$RUNNER_TEMP/release/ccmixter.apk" \
          --artifact org.relay.extensions.octavepoc "$RUNNER_TEMP/release/octavepoc.apk"
        printf '%s' "$REPOSITORY_PRIVATE_KEY" > "$RUNNER_TEMP/repository-private.pem"
        openssl dgst -sha256 -sign "$RUNNER_TEMP/repository-private.pem" -out "$RUNNER_TEMP/index.sig" index.json
        base64 < "$RUNNER_TEMP/index.sig" | tr -d '\n' > index.json.sig
    - name: Commit catalog
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add index.json index.json.sig
        git diff --cached --quiet || git commit -m "Update extension catalog [skip ci]"
        git push
