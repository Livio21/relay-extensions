name: Android CI

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: relay-extensions-${{ github.sha }}
        if-no-files-found: error
        retention-days: 14
        path: |
          ccmixter-source/app/build/outputs/apk/debug/*.apk
          ccmixter-source/app/build/outputs/apk/release/*.apk
          fma-source/app/build/outputs/apk/debug/*.apk
          fma-source/app/build/outputs/apk/release/*.apk
          octave-poc-source/app/build/outputs/apk/debug/*.apk
          octave-poc-source/app/build/outputs/apk/release/*.apk
